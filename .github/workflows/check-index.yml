name: Check index is up to date

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild index and verify no diff
        run: |
          node publish-wiki.js
          git diff --exit-code index.md
