<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>

  <text x="20" y="30" font-size="15" font-weight="700" fill="#111827">The forward needs no mask. Sampling does.</text>
  <text x="20" y="50" font-size="11.5" fill="#6b7280">Producing the next token needs two inputs, and they become ready at different times.</text>

  <!-- forward box (top-left source) -->
  <rect x="58" y="86" width="190" height="54" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="153" y="109" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">forward t+1</text>
  <text x="153" y="126" font-size="10" fill="#166534" text-anchor="middle">the heavy GPU work</text>

  <!-- commit box (bottom-left source) -->
  <rect x="58" y="190" width="190" height="54" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="153" y="213" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">commit step t</text>
  <text x="153" y="230" font-size="10" fill="#1e40af" text-anchor="middle">advances the decode state</text>

  <!-- sample box (the join) -->
  <rect x="472" y="138" width="180" height="54" rx="5" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="562" y="161" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">sample t+1</text>
  <text x="562" y="178" font-size="10" fill="#6b7280" text-anchor="middle">pick the next token</text>

  <!-- scores arrow: forward -> sample (ready early) -->
  <path d="M 248 116 L 470 152" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="298" y="110" font-size="10.5" fill="#374151" text-anchor="start"><tspan font-weight="700">scores</tspan> — ready early, no mask</text>

  <!-- mask arrow: commit -> sample (the gate) -->
  <path d="M 248 214 L 470 178" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#am)"/>
  <text x="298" y="234" font-size="10.5" fill="#b45309" text-anchor="start"><tspan font-weight="700">mask</tspan> — only after the commit</text>

  <!-- captions -->
  <text x="20" y="270" font-size="10.5" fill="#374151">The forward only needs the last token, already on the GPU, so it can run <tspan font-weight="700">before</tspan> the commit even happens.</text>
  <text x="20" y="287" font-size="10.5" fill="#374151">Sampling also needs the mask, so <tspan font-weight="700">only the sampling waits</tspan> for the commit. The expensive forward never does.</text>
</svg>
