<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 480" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ef4444" stroke-width="1.6"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="770" height="480" fill="#ffffff"/>

  <!-- ===================== BLOCKING ===================== -->
  <text x="20" y="24" font-size="14" font-weight="700" fill="#111827">Blocking — the GPU idles between steps while the CPU catches up</text>
  <text x="18" y="69" font-size="12" font-weight="600" fill="#374151">CPU</text>
  <text x="18" y="124" font-size="12" font-weight="600" fill="#374151">GPU</text>

  <!-- CPU lane (y=50 h=28) -->
  <g text-anchor="middle">
    <rect x="140" y="50" width="190" height="28" rx="3" fill="#f9fafb" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="235" y="68" font-size="9" fill="#94a3b8">waits for the GPU</text>
    <g font-size="8.5" fill="#1e3a8a">
      <rect x="76"  y="50" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="88"  y="68">plan</text>
      <rect x="104" y="50" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="122" y="68">launch</text>
      <rect x="334" y="50" width="40" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="354" y="68">commit</text>
      <rect x="378" y="50" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="390" y="68">plan</text>
      <rect x="406" y="50" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="424" y="68">launch</text>
    </g>
  </g>

  <!-- GPU lane (y=104 h=32) -->
  <g font-size="10" text-anchor="middle">
    <rect x="140" y="104" width="190" height="32" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="235" y="124" fill="#14532d">forward + sample t</text>
    <rect x="330" y="104" width="116" height="32" rx="3" fill="url(#hatch)" stroke="#ef4444"/>
    <text x="388" y="124" fill="#b91c1c" font-size="9" font-weight="700">idle</text>
    <rect x="446" y="104" width="190" height="32" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="541" y="124" fill="#14532d">forward + sample t+1</text>
  </g>

  <!-- bubble callout -->
  <path d="M388 150 L388 138" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arRed)"/>
  <text x="388" y="163" font-size="10" fill="#b91c1c" text-anchor="middle">the bubble: GPU idle while the CPU commits, plans, and launches the next step</text>

  <!-- time axis -->
  <line x1="76" y1="182" x2="636" y2="182" stroke="#d1d5db" stroke-width="1" marker-end="url(#ar)"/>
  <text x="644" y="186" font-size="9.5" fill="#9ca3af">time</text>

  <!-- ===================== PIPELINED ===================== -->
  <text x="20" y="248" font-size="14" font-weight="700" fill="#111827">Pipelined — the CPU works while the GPU runs the next forward</text>
  <text x="18" y="293" font-size="12" font-weight="600" fill="#374151">CPU</text>
  <text x="18" y="348" font-size="12" font-weight="600" fill="#374151">GPU</text>

  <!-- overlap highlight under forward t+1 -->
  <rect x="330" y="266" width="190" height="94" fill="#fde68a" opacity="0.30"/>

  <!-- CPU lane (y=274 h=28) -->
  <g text-anchor="middle" font-size="8.5" fill="#1e3a8a">
    <rect x="76"  y="274" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="88"  y="292">plan</text>
    <rect x="104" y="274" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="122" y="292">launch</text>
    <rect x="144" y="274" width="40" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="164" y="292">commit</text>
    <rect x="188" y="274" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="200" y="292">plan</text>
    <rect x="216" y="274" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="234" y="292">launch</text>
    <rect x="334" y="274" width="40" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="354" y="292">commit</text>
    <rect x="378" y="274" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="390" y="292">plan</text>
    <rect x="406" y="274" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="424" y="292">launch</text>
    <rect x="524" y="274" width="40" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="544" y="292">commit</text>
    <rect x="568" y="274" width="24" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="580" y="292">plan</text>
    <rect x="596" y="274" width="36" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="614" y="292">launch</text>
  </g>

  <!-- GPU lane (y=326 h=32) contiguous -->
  <g font-size="10" text-anchor="middle">
    <rect x="140" y="326" width="190" height="32" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="235" y="346" fill="#14532d">forward t</text>
    <rect x="330" y="326" width="190" height="32" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="425" y="346" fill="#14532d">forward t+1</text>
    <rect x="520" y="326" width="190" height="32" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="615" y="346" fill="#14532d">forward t+2</text>
  </g>

  <!-- overlap callout -->
  <text x="425" y="377" font-size="10" fill="#92400e" text-anchor="middle">during forward t+1 the CPU commits t, plans, and launches t+2 — the GPU never stops</text>

  <!-- continuous bracket -->
  <line x1="140" y1="390" x2="710" y2="390" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="140" y1="386" x2="140" y2="394" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="710" y1="386" x2="710" y2="394" stroke="#16a34a" stroke-width="1.2"/>
  <text x="425" y="406" font-size="10" fill="#15803d" text-anchor="middle">GPU runs back-to-back — the CPU's work is hidden underneath</text>

  <!-- legend + scale note -->
  <g font-size="10" fill="#374151">
    <rect x="140" y="438" width="13" height="11" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="158" y="447">CPU work</text>
    <rect x="230" y="438" width="13" height="11" rx="2" fill="#dcfce7" stroke="#22c55e"/>
    <text x="248" y="447">GPU work</text>
    <rect x="320" y="438" width="13" height="11" rx="2" fill="url(#hatch)" stroke="#ef4444"/>
    <text x="338" y="447">idle</text>
  </g>
  <text x="140" y="468" font-size="9.5" fill="#9ca3af">Schematic, not to scale — on real hardware the bubble is a few percent of each step (see the cost model).</text>
</svg>
