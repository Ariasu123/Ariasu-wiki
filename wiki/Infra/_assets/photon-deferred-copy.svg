<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="740" height="268" fill="#ffffff"/>

  <text x="20" y="26" font-size="14" font-weight="700" fill="#111827">The copy runs in the background while the GPU runs the next forward</text>

  <text x="14" y="88" font-size="11.5" font-weight="600" fill="#374151">compute</text>
  <text x="14" y="101" font-size="11.5" font-weight="600" fill="#374151">stream</text>
  <text x="14" y="158" font-size="11.5" font-weight="600" fill="#374151">copy</text>
  <text x="14" y="171" font-size="11.5" font-weight="600" fill="#374151">stream</text>

  <!-- event ticks: each copy starts the instant its forward finishes -->
  <line x1="320" y1="102" x2="320" y2="140" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="320" y="124" font-size="8.5" fill="#94a3b8" text-anchor="middle">result t ready</text>
  <line x1="470" y1="102" x2="470" y2="140" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- compute stream lane (y=64 h=38) -->
  <g font-size="10" text-anchor="middle">
    <rect x="170" y="64" width="150" height="38" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="245" y="87" fill="#14532d">forward t</text>
    <rect x="320" y="64" width="150" height="38" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="395" y="87" fill="#14532d">forward t+1</text>
    <rect x="470" y="64" width="150" height="38" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="545" y="87" fill="#14532d">forward t+2</text>
  </g>

  <!-- copy stream lane (y=140 h=28) -->
  <g font-size="9" text-anchor="middle">
    <rect x="320" y="140" width="52" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="346" y="158" fill="#92400e">copy t</text>
    <rect x="470" y="140" width="52" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="496" y="158" fill="#92400e">copy t+1</text>
  </g>

  <!-- time axis -->
  <line x1="170" y1="182" x2="620" y2="182" stroke="#d1d5db" stroke-width="1" marker-end="url(#ar)"/>
  <text x="628" y="186" font-size="9.5" fill="#9ca3af">time</text>

  <!-- captions -->
  <text x="20" y="210" font-size="10.5" fill="#374151">Each result is copied to host memory on a separate copy stream, kicked off the moment its forward finishes.</text>
  <text x="20" y="228" font-size="10.5" fill="#374151">The copy overlaps the next forward, so by the time the CPU needs the token it is already in host memory.</text>
  <text x="20" y="246" font-size="10.5" fill="#9ca3af">A blocking loop instead waits for that copy right after the forward, stalling before the next step can start.</text>
</svg>
